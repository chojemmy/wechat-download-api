<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户登录 - WeChat RSS</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f5f5f5;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#222}
    .card{width:360px;background:#fff;border:1px solid #eee;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.08);padding:28px}
    h1{font-size:22px;margin:0 0 8px} p{color:#666;font-size:14px;margin:0 0 22px;line-height:1.5}
    label{display:block;font-size:13px;color:#555;margin:12px 0 6px} input{width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:8px;padding:10px 12px;font-size:15px}
    button{width:100%;margin-top:18px;border:0;border-radius:8px;padding:11px 14px;background:#1890ff;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#fff;color:#1890ff;border:1px solid #1890ff;margin-top:10px}
    .msg{margin-top:14px;font-size:13px;color:#d4380d;white-space:pre-wrap}.ok{color:#389e0d}
  </style>
</head>
<body>
  <div class="card">
    <h1>应用账号登录</h1>
    <p>每个用户登录自己的应用账号后，再扫码绑定自己的微信公众号后台凭证和 RSS 订阅。</p>
    <label>用户名</label><input id="username" autocomplete="username" />
    <label>密码</label><input id="password" type="password" autocomplete="current-password" />
    <button onclick="login()">登录</button>
    <button class="secondary" onclick="register()">注册新账号</button>
    <div id="msg" class="msg"></div>
  </div>
<script>
async function submit(path){
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  const msg=document.getElementById('msg');
  msg.className='msg'; msg.textContent='';
  if(!username||!password){msg.textContent='请输入用户名和密码';return;}
  const res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
  const data=await res.json().catch(()=>({}));
  if(!res.ok||!data.success){msg.textContent=data.detail||data.error||'操作失败';return;}
  msg.className='msg ok'; msg.textContent='登录成功，正在进入后台...';
  setTimeout(()=>{ location.href='/admin.html'; },500);
}
function login(){submit('/api/users/login')}
function register(){submit('/api/users/register')}
</script>
</body>
</html>
